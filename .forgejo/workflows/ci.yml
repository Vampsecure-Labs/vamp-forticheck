name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: docker
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio rich aiohttp cryptography dnspython pyyaml ldap3 fpdf2 scapy
          pip install -e . --no-deps

      - name: Tests unitarios
        run: pytest tests/test_unit.py -v -m "not integration" --tb=short

      - name: Lint
        run: pip install ruff && ruff check . --ignore E501,E402
