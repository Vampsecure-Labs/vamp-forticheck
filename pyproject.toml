[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vamp-forticheck"
version = "1.0.0"
description = "Multi-vendor network appliance CVE scanner — FortiOS, PAN-OS, Cisco ASA/IOS-XE, Check Point, Juniper"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["fortinet", "fortios", "cve", "scanner", "network", "security", "pentest", "panos", "cisco"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = ["aiohttp>=3.9.0", "rich>=13.7.0"]

[project.scripts]
vamp-forticheck = "vamp_forticheck:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-forticheck"
Repository = "https://github.com/Vampsecure-Labs/vamp-forticheck"

[tool.setuptools]
py-modules = ["vamp_forticheck", "vampsec_report"]
